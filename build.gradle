plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

def requestedMc = providers.gradleProperty('mc').getOrElse(project.minecraft_version)
if (requestedMc != project.minecraft_version) {
    throw new GradleException("This source branch targets Minecraft ${project.minecraft_version}; use its matching branch for ${requestedMc}.")
}
def targets = [
    '1.20.1': [java: 17, sodium: 'mc1.20.1-0.5.13-fabric', iris: '1.7.6+1.20.1'],
    '1.20.4': [java: 17, sodium: 'mc1.20.4-0.5.8', iris: '1.7.2+1.20.4'],
    '1.21.1': [java: 21, sodium: 'mc1.21.1-0.6.13-fabric', iris: '1.8.8+1.21.1-fabric']
]
def target = targets[project.minecraft_version]
if (target == null) throw new GradleException("Unsupported Minecraft version: ${project.minecraft_version}")

version = project.mod_version + '-' + project.minecraft_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

apply from: 'gradle/local-libraries.gradle'

loom {
    splitEnvironmentSourceSets()
    runs { client { runDir providers.gradleProperty('runDir').getOrElse('run') } }
    mods {
        irlite {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation files(localCmlJar)
    modImplementation localCoreCoordinate
    include localCoreCoordinate
    modImplementation "maven.modrinth:sodium:${target.sodium}"
    modImplementation "maven.modrinth:iris:${target.iris}"
    modImplementation 'org.anarres:jcpp:1.4.14'
    modImplementation 'io.github.douira:glsl-transformer:2.0.0-pre13'
}

processResources {
    def properties = [version: project.version, minecraft_version: project.minecraft_version, java_version: target.java]
    inputs.properties properties
    filesMatching('fabric.mod.json') { expand properties }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = target.java
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(target.java)
    targetCompatibility = JavaVersion.toVersion(target.java)
}
jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
/* Match the client JVM to Minecraft, independently of the JVM running Gradle. */
def localRuntime = new Properties()
def localRuntimeFile = file('gradle/local-runtime.properties')
if (localRuntimeFile.isFile()) {
    localRuntimeFile.withInputStream { localRuntime.load(it) }
}
def runtimeHome = providers.gradleProperty('runJavaHome').orNull ?: localRuntime.getProperty('runJavaHome')
tasks.withType(JavaExec).configureEach {
    if (runtimeHome != null) {
        def javaHome = file(runtimeHome)
        executable = new File(javaHome, 'bin/java' + (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? '.exe' : ''))
        doFirst {
            def release = new Properties()
            new File(javaHome, 'release').withInputStream { release.load(it) }
            def actual = JavaVersion.toVersion(release.getProperty('JAVA_VERSION').replace('"', '')).majorVersion
            if (actual != target.java.toString()) {
                throw new GradleException("Minecraft ${project.minecraft_version} development client requires Java ${target.java}; ${javaHome} supplies Java ${actual}.")
            }
        }
    } else {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(target.java) }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyLocalLibraries') }

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
}
