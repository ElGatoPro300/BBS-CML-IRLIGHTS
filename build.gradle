plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'maven-publish'
}

/* The matrix coordinator never loads a target's Loom project in its own process. */
if (gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'buildAll' }) {
    apply from: 'gradle/build-all.gradle'
    return
}

def requestedMinecraft = providers.gradleProperty('mc').getOrElse(project.minecraft_version)
def officialNamespace = requestedMinecraft.startsWith('26.')
apply plugin: officialNamespace ? 'net.fabricmc.fabric-loom' : 'fabric-loom'

apply from: 'gradle/minecraft-targets.gradle'
def target = minecraftTarget

version = project.mod_version + '-' + project.minecraft_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

apply from: 'gradle/local-libraries.gradle'

loom {
    splitEnvironmentSourceSets()
    runs { client { runDir providers.gradleProperty('runDir').getOrElse('run') } }
    mods {
        irlite {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

def generatedOfficial = file('build/source-bridge/official')
if (officialNamespace) {
    def prepareSources = tasks.register('prepareOfficialSources', Exec) {
        inputs.files(['src/main/java', 'src/domain/java', 'src/client/java',
            'src/platform/mc12111/client/java', 'src/platform/casterModern/client/java',
            'src/platform/iris18/client/java', 'src/platform/irisModernProfile/client/java',
            'src/platform/blendSetup/client/java'].collect { fileTree(it) { include '**/*.java' } })
        inputs.files(fileTree('tools/source_bridge'), fileTree('gradle/source-bridge') { include '*.gradle', 'gradle.properties' })
        inputs.file 'gradle/minecraft-targets.json'
        inputs.files(fileTree('tools') { include '**/*.java', 'fixture_adapters.py' })
        def bridgeLibraries = new File(file(providers.gradleProperty('libDir').getOrElse('lib')), '1.21.11')
        inputs.files fileTree(bridgeLibraries) { include '*.jar' }
        outputs.dir generatedOfficial
        commandLine new File(projectDir, System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'gradlew.bat' : 'gradlew'),
            '-p', file('gradle/source-bridge'), 'prepareOfficialSources', '--console=plain'
        if (providers.gradleProperty('libDir').isPresent()) {
            args '-PlibDir=' + file(providers.gradleProperty('libDir').get()).absolutePath
        }
    }
    tasks.withType(JavaCompile).configureEach { dependsOn prepareSources }
    tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn prepareSources }
}
sourceSets {
    if (officialNamespace) {
        main.java.setSrcDirs([new File(generatedOfficial, 'main'), new File(generatedOfficial, 'domain')])
        client.java.setSrcDirs([new File(generatedOfficial, 'client'), new File(generatedOfficial, 'caster')])
    } else {
        main.java.srcDir 'src/domain/java'
    }
    client.java.srcDirs "src/platform/${target.minecraftAdapter}/client/java",
        "src/platform/${officialNamespace ? (target.depthAdapter ?: 'empty') : (target.casterAdapter ?: 'casterImmediate')}/client/java",
        "src/platform/${target.irisAdapter}/client/java",
        "src/platform/${target.irisProfileAdapter ?: 'irisLegacyProfile'}/client/java",
        "src/platform/${target.blendAdapter ?: (target.shaderBlendMethod == 'bind' ? 'blendBind' : 'blendApply')}/client/java"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (!officialNamespace) mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    def implementationScope = officialNamespace ? 'implementation' : 'modImplementation'
    add(implementationScope, "net.fabricmc:fabric-loader:${project.loader_version}")
    add(implementationScope, "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
    add(implementationScope, files(localCmlJar))
    add(implementationScope, localCoreCoordinate)
    include localCoreCoordinate
    add(implementationScope, "maven.modrinth:sodium:${target.sodium}")
    add(implementationScope, "maven.modrinth:iris:${target.iris}")
    add(implementationScope, 'org.anarres:jcpp:1.4.14')
    add(implementationScope, "io.github.douira:glsl-transformer:${target.glslTransformer ?: '2.0.0-pre13'}")
}

processResources {
    def properties = [version: project.version, minecraft_version: project.minecraft_version, java_version: target.java]
    inputs.properties properties
    filesMatching('fabric.mod.json') { expand properties }
}

tasks.named('processClientResources') {
    from('patches') {
        include '*.irlights'
        into 'assets/irlite/patches'
    }
    inputs.property('javaVersion', target.java)
    inputs.property('classicShadowDepth', target.classicShadowDepth ?: false)
    filesMatching('irlite.client.mixins.json') { expand java_version: target.java, native_depth_mixin: target.classicShadowDepth ? ',"bbs.ClassicShadowDepthMixin"' : '' }
}
processResources {
    filesMatching('irlite.mixins.json') { expand java_version: target.java, native_depth_mixin: target.classicShadowDepth ? ',"bbs.ClassicShadowDepthMixin"' : '' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = target.java
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(target.java)
    targetCompatibility = JavaVersion.toVersion(target.java)
}
jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
/* Match the client JVM to Minecraft, independently of the JVM running Gradle. */
def localRuntime = new Properties()
def localRuntimeFile = file('gradle/local-runtime.properties')
if (localRuntimeFile.isFile()) {
    localRuntimeFile.withInputStream { localRuntime.load(it) }
}
def runtimeHome = providers.gradleProperty('runJavaHome').orNull
    ?: localRuntime.getProperty('runJavaHome.' + project.minecraft_version)
    ?: localRuntime.getProperty('runJavaHome')
tasks.withType(JavaExec).configureEach {
    systemProperty 'irlite.platform.shaderBlendMethod', target.shaderBlendMethod
    if (runtimeHome != null) {
        def javaHome = file(runtimeHome)
        executable = new File(javaHome, 'bin/java' + (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? '.exe' : ''))
        doFirst {
            def release = new Properties()
            new File(javaHome, 'release').withInputStream { release.load(it) }
            def actual = JavaVersion.toVersion(release.getProperty('JAVA_VERSION').replace('"', '')).majorVersion
            if (actual != target.java.toString()) {
                throw new GradleException("Minecraft ${project.minecraft_version} development client requires Java ${target.java}; ${javaHome} supplies Java ${actual}.")
            }
        }
    } else {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(target.java) }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyLocalLibraries') }

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
}
