gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.register('profileTestClasspath') {
        dependsOn root.tasks.named('compileClientJava')
        doLast {
            def output = root.layout.buildDirectory.file('profiles-bbs-test/classpath.txt').get().asFile
            output.parentFile.mkdirs()
            output.text = root.sourceSets.client.runtimeClasspath.asPath
        }
    }
}
